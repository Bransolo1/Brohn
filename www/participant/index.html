<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Take part in a study | Brohn</title>
  <link rel="icon" type="image/svg+xml" href="../brand/brohn-app-icon.svg">
  <link rel="stylesheet" href="runner.css">
  <link rel="stylesheet" href="maxdiff.css">
  <link rel="stylesheet" href="welcome.css">
  <script src="welcome.js" defer></script>
  <script src="tasks.js" defer></script>
  <script src="sciat-window-core.js" defer></script>
  <script src="sciat-window.js" defer></script>
  <script src="camera.js" defer></script>
  <script src="equipment.js" defer></script>
  <script src="maxdiff.js" defer></script>
  <script src="question-revision.js" defer></script>
  <script src="illustrations.js" defer></script>
  <script src="event-batch.js" defer></script>
  <script src="runner.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to study</a>
  <div id="participant-app">
    <header id="study-header">
      <span class="brand">Brohn</span>
      <span id="study-origin"></span>
      <span id="study-progress"></span>
      <span id="camera-status" role="status" hidden></span>
    </header>
    <main id="content" tabindex="-1"><h1>Opening your study</h1><p>Please wait while the study information loads.</p></main>
    <div class="messages">
      <p id="save-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="error" role="alert" tabindex="-1" hidden></div>
    </div>
    <footer><button id="withdraw" type="button" class="secondary" hidden>Stop study</button></footer>
  </div>
  <noscript>This study needs JavaScript to present the study and save your responses. Please enable JavaScript or contact your researcher.</noscript>
</body>
</html>
